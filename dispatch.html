<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Noble Dispatch</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:system-ui,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    overflow:hidden;
    background:#0b1030;
}

/* SKY */
.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    
    background: linear-gradient(to bottom,
            #ffffff 0%,
            #f8fcff 8%,
            #dff4ff 15%,
            #87CEEB 35%,
            #5bb8e8 100%);
}
.sky::before {
content: "";
position: absolute;
inset: 0;

background: linear-gradient(to bottom,
    #0b1030 0%,
    #0b1030 10%,
    #3b1d6e 55%,
    #f97316 100%
);

opacity: 0;
animation: nightFade 45s infinite ease-in-out;

}

.sun {
    position: absolute;
    top: 18vh;
    left: 10vw;
    
    width: 70px;
    height: 70px;
    
    border-radius: 50%;
    
    background: #FFD93D;
    
    box-shadow: 8px 7px 40px #FFD93D;
    
    animation: sunCycle 45s infinite ease-in-out;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #fff;
    
    animation: starCycle 45s infinite ease-in-out;
}

@keyframes tw {
    50% {
        opacity: .2
    }
}

@keyframes nightFade {
    0% {
        opacity: 0;
    }
    
    25% {
        opacity: 0.5;
    }
    
    50% {
        opacity: 1;
    }
    
    75% {
        opacity: 0.5;
    }
    
    100% {
        opacity: 0;
    }
    
}
@keyframes sunCycle {
    
    0% {
        opacity: 1;
    }
    
    50% {
        opacity: 0;
    }
    
    100% {
        opacity: 1;
    }
    
}

@keyframes moonCycle {
    
    0% {
        opacity: 0;
    }
    
    50% {
        opacity: 1;
    }
    
    100% {
        opacity: 0;
    }
    
}

@keyframes starCycle {
    
    0% {
        opacity: 0;
    }
    
    50% {
        opacity: 1;
    }
    
    100% {
        opacity: 0;
    }
    
}

/* moon */

.moon {
    position: absolute;
    top: 6vh;
    right: 10vw;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #FCFCFC;
    box-shadow: 0 0 30px #CCCB99;
    animation: moonCycle 45s infinite ease-in-out;
}


/* CITY */

.city{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:22vh;
    display:flex;
    align-items:flex-end;
    gap:3px;
    padding:0 3px;
}

.b{
    flex:1;
    background:#080b20;
    display:flex;
    flex-wrap:wrap;
    align-content:flex-start;
    gap:4px;
    padding:6px 4px;
    overflow:hidden;
}

.w{
    display:block;
    width:5px;
    height:6px;
    background:#26304a;
}

.w.on{
    background:#fde047;
    animation:tw 4s infinite;
}

/* PACKAGE FALLING ANIMATION */

.package{
    position:absolute;
    top:-100px;
    left:50%;
    width:76px;
    height:76px;
    margin-left:-38px;
    z-index:2;

    background:#b45309;
    border-radius:8px;

    box-shadow:0 0 25px rgba(253,224,71,.5);

    animation:fall 0.8s cubic-bezier(.2,.7,.3,1) forwards;
}

/* TAPE ON PACKAGE */

.package::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:32px;
    width:12px;
    background:#fcd34d;
}

/* HORIZONTAL TAPE */

.package::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:30px;
    height:12px;
    background:#fcd34d;
}

/* BOX FALLS TO MIDDLE */

@keyframes fall{

    0%{
        top:-100px;
        transform:rotate(-12deg) scale(.8);
        opacity:0;
    }

    15%{
        opacity:1;
    }

    65%{
        top:calc(50% - 38px);
        transform:rotate(8deg) scale(1.05);
    }

    80%{
        top:calc(50% - 38px);
        transform:rotate(-5deg) scale(1);
    }

    90%{
        top:calc(50% - 38px);
        transform:rotate(2deg) scale(1);
    }

    100%{
        top:calc(50% - 38px);
        transform:rotate(0) scale(1);
    }
}

/* BOX DISAPPEARS */

.package.open{
    animation:boxOpen .5s ease-in forwards;
}

@keyframes boxOpen{

    0%{
        opacity:1;
        transform:scale(1);
    }

    100%{
        opacity:0;
        transform:scale(1.8) rotate(12deg);
    }
}

/* GLOW RING */

.ring{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    margin:-10px;
    border-radius:50%;
    background:radial-gradient(
        #fff,
        #fde68a 40%,
        transparent 70%
    );
    opacity:0;
    pointer-events:none;
    z-index:2;
}

.ring.show{
    animation:ring .8s ease-out forwards;
}

@keyframes ring{

    20%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:scale(12);
    }
}

/* DISPATCH FORM */

.card{
    position:absolute;
    left:50%;
    top:50%;

    width:90%;
    max-width:360px;
    max-height:84vh;

    overflow-y:auto;

    padding:24px 22px;

    z-index:3;

    border-radius:20px;

    background:rgba(255,255,255,.14);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.3);

    color:#A6A9C7;

    box-shadow:0 20px 50px rgba(0,0,0,.35);

    opacity:0;
    pointer-events:none;

    transform:translate(-50%,-45%) scale(.8);
}

.card.show{
    animation:formAppear .8s cubic-bezier(.2,.9,.3,1.15) forwards;
    pointer-events:auto;
}

@keyframes formAppear{

    0%{
        opacity:0;
        transform:translate(-50%,-45%) scale(.8);
    }

    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

/* FORM HEADING */

h1{
    text-align:center;
    font-size:1.4rem;
    margin-bottom:8px;
    color:#FBB12A;
}

.subtitle{
    text-align:center;
    font-size:.85rem;
    line-height:1.5;
    margin-bottom:22px;
    color:#220B53;
}

/* INPUT FIELDS */

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:.9rem;
}

.field input,
.field textarea,
.field select{

    width:100%;

    padding:13px 12px;

    border:2px solid transparent;
    border-radius:10px;

    background:rgba(255,255,255,.2);

    color:#fff;
    font-size:1rem;

    outline:none;
    transition:.3s;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#FBB12A;
    background:rgba(255,255,255,.28);
}

.field input::placeholder,
.field textarea::placeholder{
    color:#e0e0e0;
}

.field select option{
    color:#000;
    background:#fff;
}

.field textarea{
    min-height:75px;
    resize:vertical;
}

/* SUBMIT BUTTON */

.go{
    width:100%;
    padding:14px;

    border:none;
    border-radius:12px;

    background:#FBB12A;
    color:#220B53;

    font-size:1rem;
    font-weight:700;

    cursor:pointer;
    transition:transform .2s;
}

.go:active{
    transform:scale(.97);
}

.msg{
    text-align:center;
    min-height:1.2em;
    margin-top:12px;
    font-size:.85rem;
    line-height:1.5;
}

/* SMALL SCREENS */

@media(max-height:700px){

    .card{
        max-height:78vh;
        padding:18px;
    }

    .field{
        margin-bottom:11px;
    }

    .field input,
    .field textarea,
    .field select{
        padding:10px;
    }

    .subtitle{
        margin-bottom:14px;
    }
}
.sky-logo {
position: absolute;
top: 2px;
left: 50%;
transform: translateX(-50%);
width: 50%;
max-width: 450px;
height: auto;
z-index: 0;
object-fit: contain;
border-radius:54px;
box-shadow: 0 0 30px white;
}


</style>
</head>

<body>

<div class="sky" id="sky">
    <img src="ima/blogo.jpg" class="sky-logo"/>

    <div class="moon"></div>
<div class="sun"></div>
    <div class="city" id="city"></div>

    <!-- PACKAGE -->

    <div class="package" id="package"></div>

    <div class="ring" id="ring"></div>

    <!-- DISPATCH FORM -->

    <form class="card" id="card" >

        <h1>📦 Noble Dispatch</h1>

        <p class="subtitle">
            Send your package with Noble Services.
            Fill in your delivery details below.
        </p>

        <div class="field">
            <label for="name">Your Name</label>

            <input
                type="text"
                id="name"
                placeholder="NAME"
                required
            >
        </div>

        <div class="field">
            <label for="phone">Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="eg:0812....."
                required
            >
        </div>

        <div class="field">
            <label for="pickup">Pickup Location</label>

            <input
                type="text"
                id="pickup"
                placeholder="Where should we collect it?"
                required
            >
        </div>

        <div class="field">
            <label for="destination">Delivery Location</label>

            <input
                type="text"
                id="destination"
                placeholder="deliver to ?"
                required
            >
        </div>

        <div class="field">
            <label for="details">Package Details</label>

            <textarea
                id="details"
                placeholder="What are you sending?"
                required
            ></textarea>
        </div>

        <button class="go" id="btn" type="submit">
            Send Delivery Request
        </button>

        <p class="msg" id="msg"></p>

    </form>

</div>

<script>

/* CREATE STARS */

const sky = document.getElementById("sky");

for(let i = 0; i < 40; i++){

    const s = document.createElement("div");

    s.className = "star";

    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 50 + "%";

    s.style.animationDelay = Math.random() * 3 + "s";

    sky.prepend(s);
}


/* CREATE CITY BUILDINGS */

const city = document.getElementById("city");

for(let i = 0; i < 14; i++){

    const b = document.createElement("div");

    b.className = "b";

    b.style.height = (35 + Math.random() * 65) + "%";

    for(let j = 0; j < 16; j++){

        const w = document.createElement("i");

        w.className = "w" + (Math.random() < .4 ? " on" : "");

        w.style.animationDelay = Math.random() * 4 + "s";

        b.appendChild(w);
    }

    city.appendChild(b);
}


/* PACKAGE ANIMATION */

const packageBox = document.getElementById("package");
const ring = document.getElementById("ring");
const card = document.getElementById("card");

setTimeout(() => {

    packageBox.classList.add("open");

    ring.classList.add("show");

}, 800);


setTimeout(() => {

    packageBox.style.display = "none";

    card.classList.add("show");

}, 1000);


</script>

<script type="module">
import { db } from "./Firebase.js";

import {
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const form = document.getElementById("card");
const button = document.getElementById("btn");
const message = document.getElementById("msg");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const order = {
    customer_name: document.getElementById("name").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    pickup: document.getElementById("pickup").value.trim(),
    dropoff: document.getElementById("destination").value.trim(),
    package_details: document.getElementById("details").value.trim(),
    order_type: "Dispatch",
    vehicle: "",
    status: "Pending",
    created_at: serverTimestamp()
  };

  button.disabled = true;
  button.textContent = "Sending request...";
  message.textContent = "";

  try {
    await addDoc(collection(db, "bookings"), order);

    message.textContent = "Your delivery request was received successfully!";
    button.textContent = "✓ Request Sent";
    form.reset();

  } catch (error) {
    console.error("Dispatch Firebase error:", error);
    
    message.textContent = error.code + ": " + error.message;
    button.textContent = "Send Delivery Request";

  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
